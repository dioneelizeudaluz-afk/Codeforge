<!DOCTYPE html>
<html lang="pt">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CodeForge</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <div class="app">

    <!-- ======================================
         SIDEBAR
         ====================================== -->

    <aside class="sidebar">

      <button
        class="logo"
        id="homeBtn"
        type="button"
      >

        <div class="logo-icon">
          &lt;/&gt;
        </div>

        <span>CodeForge</span>

      </button>


      <!-- NOVO PROJETO -->

      <button
        class="new-project"
        id="newProject"
        type="button"
      >
        + Novo projeto
      </button>


      <!-- ====================================
           PROJECTS
           ==================================== -->

      <div class="section-title">
        MEUS PROJETOS
      </div>


      <div
        id="projectList"
        class="project-list"
      >

        <!-- Projetos serão criados pelo JavaScript -->

      </div>


      <!-- ====================================
           FILES
           ==================================== -->

      <div class="section-title files-title">
        FICHEIROS
      </div>


      <div
        id="fileExplorer"
        class="file-explorer"
      >

        <!-- Ficheiros serão criados pelo JavaScript -->

      </div>


      <button
        class="new-file-button"
        id="newFileBtn"
        type="button"
      >
        + Novo ficheiro
      </button>


      <!-- ====================================
           BOTTOM
           ==================================== -->

      <div class="sidebar-bottom">

        <button
          id="settingsBtn"
          type="button"
        >
          Configurações
        </button>

        <button
          id="helpBtn"
          type="button"
        >
          Ajuda
        </button>

      </div>

    </aside>


    <!-- ======================================
         MAIN
         ====================================== -->

    <main class="main">


      <!-- TOPBAR -->

      <header class="topbar">

        <div
          class="project-name"
          id="projectName"
        >

          <span class="status"></span>

          Meu Projeto

        </div>


        <div class="top-actions">

          <button
            id="previewBtn"
            type="button"
          >
            Preview
          </button>


          <button
            id="saveBtn"
            class="save-btn"
            type="button"
          >
            Salvar
          </button>

        </div>

      </header>


      <!-- ====================================
           EDITOR
           ==================================== -->

      <section class="editor-area">

        <div class="editor-header">

          <span id="currentFileName">
            index.html
          </span>

          <span
            class="language"
            id="currentLanguage"
          >
            HTML
          </span>

        </div>


        <textarea
          id="codeEditor"
          spellcheck="false"
        ></textarea>

      </section>


      <!-- ====================================
           CHAT
           ==================================== -->

      <section class="chat">

        <div class="chat-title">

          <strong>
            Code Chat
          </strong>

          <small>
            Cole código para importar para o projeto
          </small>

        </div>


        <div class="chat-input-area">

          <textarea
            id="chatInput"
            placeholder="Cole aqui o código..."
          ></textarea>


          <button
            id="sendBtn"
            class="send-btn"
            type="button"
          >
            ➤
          </button>

        </div>

      </section>

    </main>

  </div>


  <!-- ======================================
       SCRIPT
       ====================================== -->

  <script src="app.js?v=5"></script>

</body>
          </html>
