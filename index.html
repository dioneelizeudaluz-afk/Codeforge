<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b10">
  <title>CodeForge</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="topbar">

      <div class="brand-area">
        <button id="menuBtn" class="icon-btn" type="button">
          ☰
        </button>

        <button id="homeBtn" class="brand" type="button">
          <span class="brand-mark">&lt;/&gt;</span>
          <span>CodeForge</span>
        </button>
      </div>

      <div id="projectName" class="current-project">
        <span class="online-dot"></span>
        <span>Meu Projeto</span>
      </div>

      <div class="top-actions">
        <button id="previewBtn" class="secondary-btn" type="button">
          Preview
        </button>

        <button id="saveBtn" class="primary-btn" type="button">
          Salvar
        </button>
      </div>

    </header>


    <aside id="sideMenu" class="side-menu">

      <div class="menu-top">

        <div class="menu-title">
          <span class="brand-mark small">&lt;/&gt;</span>
          <span>CodeForge</span>
        </div>

        <button
          id="closeMenuBtn"
          class="close-btn"
          type="button"
        >
          ×
        </button>

      </div>


      <button
        id="newProject"
        class="new-project-btn"
        type="button"
      >
        <span>+</span>
        <span>Novo projeto</span>
      </button>


      <div class="menu-section">

        <div class="section-title">
          PROJETOS
        </div>

        <div id="projectList" class="project-list"></div>

      </div>


      <div class="menu-section files-section">

        <div class="section-title">
          FICHEIROS
        </div>

        <div class="menu-files">

          <div class="menu-file">
            <span class="menu-file-icon html-icon">◇</span>
            <span>index.html</span>
          </div>

          <div class="menu-file">
            <span class="menu-file-icon css-icon">#</span>
            <span>style.css</span>
          </div>

          <div class="menu-file">
            <span class="menu-file-icon js-icon">JS</span>
            <span>app.js</span>
          </div>

        </div>

      </div>


      <div class="menu-bottom">

        <button
          id="deleteProjectBtn"
          class="delete-btn"
          type="button"
        >
          <span>Apagar projeto</span>
        </button>

      </div>

    </
