<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CodeForge</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <button class="logo" id="homeBtn" type="button">
  <div class="logo-icon">&lt;/&gt;</div>
  <span>CodeForge</span>
      </button>

      <button class="new-project" id="newProject">
        + Novo projeto
      </button>

      <div class="section-title">PROJETO</div>

      <div class="file active">
        <span>📄</span>
        index.html
      </div>

      <div class="file">
        <span>🎨</span>
        style.css
      </div>

      <div class="file">
        <span>⚡</span>
        app.js
      </div>

      <div class="sidebar-bottom">
        <button>⚙️ Configurações</button>
        <button>❔ Ajuda</button>
      </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

      <!-- HEADER -->
      <header class="topbar">

        <div class="project-name">
          <span class="status"></span>
          Meu Projeto
        </div>

        <div class="top-actions">
          <button id="previewBtn">Preview</button>
          <button class="save-btn" id="saveBtn">Salvar</button>
        </div>

      </header>


      <!-- EDITOR -->
      <section class="editor-area">

        <div class="editor-header">
          <span>index.html</span>
          <span class="language">HTML</span>
        </div>

        <textarea id="codeEditor" spellcheck="false"><!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Meu Projeto</title>
</head>

<body>

  <h1>Bem-vindo ao CodeForge</h1>

  <p>Comece a construir o seu projeto.</p>

</body>
</html></textarea>

      </section>


      <!-- CHAT -->
      <section class="chat">

        <div class="chat-title">
          <div>
            <strong>Code Chat</strong>
            <small>Insira código ou instruções</small>
          </div>
        </div>

        <div class="chat-input-area">

          <textarea
            id="chatInput"
            placeholder="Cole aqui o código ou escreva uma instrução..."
          ></textarea>

          <button id="sendBtn" class="send-btn">
            ➤
          </button>

        </div>

      </section>

    </main>

  <script src="app.js?v=3"></script>

</body>
        </html>
