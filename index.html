<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeForge</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="top-left">

      <button id="menuBtn" class="menu-btn" type="button">
        ☰
      </button>

      <button id="homeBtn" class="logo" type="button">
        <span class="logo-icon">&lt;/&gt;</span>
        <span>CodeForge</span>
      </button>

    </div>

    <div class="project-name" id="projectName">
      <span class="status"></span>
      Meu Projeto
    </div>

    <div class="top-actions">

      <button id="previewBtn" type="button">
        Preview
      </button>

      <button id="saveBtn" class="save-btn" type="button">
        Salvar
      </button>

    </div>

  </header>


  <!-- MENU -->

  <aside id="sideMenu" class="side-menu">

    <div class="menu-header">

      <strong>CodeForge</strong>

      <button id="closeMenuBtn" type="button">
        ×
      </button>

    </div>


    <button id="newProject" class="menu-new-project" type="button">
      + Novo projeto
    </button>


    <div class="menu-section-title">
      MEUS PROJETOS
    </div>


    <div id="projectList" class="project-list">
    </div>


    <button id="deleteProjectBtn" class="delete-project-btn" type="button">
      🗑 Apagar projeto
    </button>

  </aside>


  <div id="menuOverlay" class="menu-overlay"></div>


  <!-- EDITOR -->

  <main class="main">

    <section class="editor-area">

      <div class="editor-header">

        <div class="file-tabs" id="fileExplorer">
        </div>

        <span id="currentLanguage" class="language">
          HTML
        </span>

      </div>


      <textarea
        id="codeEditor"
        spellcheck="false"
      ></textarea>

    </section>


    <!-- CHAT -->

    <section class="chat">

      <div class="chat-title">

        <strong>Code Chat</strong>

        <small>
          Cole código para importar para o projeto
        </small>

      </div>


      <div class="chat-input-area">

        <textarea
          id="chatInput"
          placeholder="Cole aqui o código..."
        ></textarea>

        <button
          id="sendBtn"
          class="send-btn"
          type="button"
        >
          ➤
        </button>

      </div>

    </section>

  </main>

</div>


<script src="app.js?v=6"></script>

</body>
      </html>
